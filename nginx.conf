# Non-root nginx for a static Hugo site.
# Master + workers run as the unprivileged `nginx` user, so the pid file and
# all temp paths live under /tmp (world-writable) and the listener is on 8080.

worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temp paths the unprivileged user can write.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log  /dev/stdout;

    # nginx sits behind Caddy and only knows its own http://…:8080. Redirects
    # (a directory URL without its trailing slash) carry a relative Location so
    # the browser stays on Caddy's scheme, host and port. No version banner.
    absolute_redirect  off;
    server_tokens      off;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript application/json image/svg+xml application/rss+xml;

    server {
        listen       8080;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Hugo emits a directory-per-page (…/index.html), so a directory match
        # resolves to its index; a genuine miss falls through to Hugo's 404.
        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;
    }
}
